<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }} · Frontier Voice</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <style>
    :root {
      --ink: #1a1a1f;
      --muted: #5b616e;
      --line: #e6e8ec;
      --bg: #ffffff;
      --accent: #3b5bdb;
      --code-bg: #f4f5f7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e8eaed;
        --muted: #9aa0ad;
        --line: #2b2e36;
        --bg: #17181c;
        --accent: #8aa0ff;
        --code-bg: #22242b;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap { max-width: 780px; margin: 0 auto; padding: 0 20px; }
    header.site {
      border-bottom: 1px solid var(--line);
      padding: 22px 0 18px;
    }
    header.site .brand { margin: 0; font-weight: 700; letter-spacing: .2px; }
    header.site nav { margin-top: 10px; }
    header.site nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      margin-right: 18px;
    }
    header.site nav a:hover { color: var(--accent); }
    main { padding: 34px 0 48px; }
    main h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 .4em; }
    main h2 { font-size: 1.3rem; margin: 1.8em 0 .5em; }
    main h3 { font-size: 1.05rem; margin: 1.4em 0 .4em; }
    a { color: var(--accent); }
    hr { border: none; border-top: 1px solid var(--line); margin: 2em 0; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1em 0;
      font-size: 14.5px;
      display: block;
      overflow-x: auto;
    }
    th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
    th { background: var(--code-bg); }
    code {
      background: var(--code-bg);
      padding: 2px 5px;
      border-radius: 4px;
      font-size: .9em;
    }
    blockquote {
      margin: 1em 0;
      padding: .2em 1em;
      border-left: 3px solid var(--line);
      color: var(--muted);
    }
    footer.site {
      border-top: 1px solid var(--line);
      padding: 20px 0 40px;
      color: var(--muted);
      font-size: 14px;
    }
    footer.site a { color: var(--muted); }
  </style>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <p class="brand">Frontier Voice · Mindcom Media Ltd</p>
      <nav>
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/privacy' | relative_url }}">Privacy</a>
        <a href="{{ '/terms' | relative_url }}">Terms</a>
        <a href="{{ '/support' | relative_url }}">Support</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="wrap">
      {{ content }}
    </div>
  </main>
  <footer class="site">
    <div class="wrap">
      © Mindcom Media Ltd · <a href="mailto:hello@getunlocked.ai">hello@getunlocked.ai</a>
    </div>
  </footer>
</body>
</html>
